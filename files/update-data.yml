# Save to path .github/workflows/update-data.yml
name: Update figures

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 06:00/07:00 Finnish time
  workflow_dispatch:       # a button for a manual run

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch figures from the APIs
        run: node fetch-data.mjs

      - name: Build the share pages and images
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node build-pages.mjs

      - name: Commit if changed
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data.json dist
          git diff --staged --quiet || git commit -m "Updated figures $(date -u +%Y-%m-%d)"
          git push
