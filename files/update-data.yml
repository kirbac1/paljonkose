# Tallenna polkuun .github/workflows/update-data.yml
name: Päivitä luvut

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 06:00/07:00 Suomen aikaa
  workflow_dispatch:       # nappi manuaaliseen ajoon

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Asenna riippuvuudet
        run: npm ci || npm install

      - name: Hae luvut rajapinnoista
        run: node fetch-data.mjs

      - name: Rakenna jakosivut ja kuvat
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node build-pages.mjs

      - name: Commitoi jos muuttui
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data.json dist
          git diff --staged --quiet || git commit -m "Päivitetyt luvut $(date -u +%Y-%m-%d)"
          git push
