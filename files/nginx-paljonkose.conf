# /etc/nginx/sites-available/paljonkose.fi
#
# Aja ensin:  certbot --nginx -d paljonkose.fi -d www.paljonkose.fi
# Certbot lisää ssl_certificate-rivit automaattisesti.

# www → juuri
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.paljonkose.fi;
    return 301 https://paljonkose.fi$request_uri;
}

# http → https
server {
    listen 80;
    listen [::]:80;
    server_name paljonkose.fi www.paljonkose.fi;
    return 301 https://paljonkose.fi$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name paljonkose.fi;

    # ssl_certificate     /etc/letsencrypt/live/paljonkose.fi/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/paljonkose.fi/privkey.pem;

    # Jakokuvat ovat isoin siirretty tavumäärä — anna selaimen ja
    # välityspalvelimien pitää ne pitkään.
    location ~ /og\.png$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Jos sivu leviää, tämä estää yhtä IP:tä kaatamasta kuvageneraattoria.
    # Vaatii ylemmäs http-lohkoon:
    #   limit_req_zone $binary_remote_addr zone=paljonkose:10m rate=30r/s;
    # location / { limit_req zone=paljonkose burst=60 nodelay; ... }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    client_max_body_size 1m;
}
