services:
  web:
    build: .
    restart: unless-stopped
    environment:
      SITE_URL: "https://paljonkose.fi"
      PORT: "3000"
      STATS_FILE: "/data/stats.json"
      RELOAD_TOKEN: "${RELOAD_TOKEN}"         # .env-tiedostosta
    volumes:
      - state:/data
      - ./data.json:/app/data.json:ro         # päivitin kirjoittaa tämän
    ports:
      - "127.0.0.1:3000:3000"                 # vain reverse proxyn kautta ulos

  # Hakee luvut kerran vuorokaudessa ja pyytää webiä lataamaan ne uudelleen.
  # Ei uudelleenkäynnistystä, ei katkosta.
  updater:
    build: .
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'while true; do
         node fetch-data.mjs || echo "haku epäonnistui, vanhat luvut jäävät voimaan";
         wget -q -O- --post-data="" --header="x-token=$${RELOAD_TOKEN}" http://web:3000/api/reload || true;
         sleep 86400;
       done'
    environment:
      RELOAD_TOKEN: "${RELOAD_TOKEN}"
    volumes:
      - ./data.json:/app/data.json            # kirjoitusoikeus tähän
    depends_on:
      - web

volumes:
  state:
