name: Deploy to production

# Builds web/ (React) and ships it into files/public/, then deploys
# files/ to the Plesk server on every push to main. The old vanilla-JS
# frontend has been removed from the repo entirely.
#
# Server facts, confirmed by SSHing in on 2026-09-02. Re-check if a deploy
# starts failing after server-side changes:
#   - paljonkose.fi is its own Plesk subscription, separate from kirbac.fi.
#     Passenger's app root is ~/httpdocs and its restart file is
#     ~/httpdocs/tmp/restart.txt (NOT inside files/)
#   - the app itself lives in httpdocs/files. That is a symlink into
#     ~/paljonkose/releases/<stamp>/files, which is what makes a release
#     swap atomic and a rollback a one-line relink. Verified that Passenger
#     follows it.
#   - stats.json sits at ~/httpdocs/stats.json, outside the release, so
#     share counters survive a deploy
#   - node comes from nodenv; "22" is what the app runs under
#   - permissions matter: a release extracted with restrictive modes makes
#     the web server return 403 while the app itself is perfectly healthy.
#     Directories must end up 755 and files 644.
#   - SITE_URL must be set, or canonical/og:url/og:image silently fall back
#     to http://localhost:PORT. It lives in files/.env, loaded by server.mjs
#     via process.loadEnvFile() and carried forward between releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race — cancelling mid-rsync would leave a
# half-written release, and two npm ci's on the same release would stomp
# on each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    name: Ship files/ and restart Passenger
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      HEALTH_URL: ${{ vars.SITE_URL || 'https://paljonkose.fi' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web/ (React) into files/public/
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key instead of accepting whatever answers, so a
          # DNS or routing surprise cannot silently redirect the deploy.
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS not set — falling back to ssh-keyscan (trust on first use)."
            ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Ship the release and restart Passenger
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SITE_URL: ${{ vars.SITE_URL || 'https://paljonkose.fi' }}
        run: |
          set -euo pipefail
          RELEASE="paljonkose/releases/$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"

          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" "mkdir -p '$RELEASE/files'"

          # node_modules is installed on the server rather than copied:
          # resvg-js ships a native binary, and the runner's architecture is
          # not the server's. tests/ and Playwright output do not belong in
          # a release.
          rsync -az --no-perms --no-owner --no-group --chmod=D755,F644 \
            -e "ssh -o BatchMode=yes" \
            --exclude node_modules \
            --exclude .env \
            --exclude tests \
            --exclude playwright-report \
            --exclude test-results \
            files/ "$SSH_USER@$SSH_HOST:$RELEASE/files/"

          # Values passed as remote env vars rather than interpolated into a
          # nested quoted string — quoting through ssh is where this kind of
          # script usually breaks.
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            RELEASE="$RELEASE" KEEP=5 SITE_URL="$SITE_URL" bash -s <<'REMOTE'
          set -euo pipefail
          APP=~/httpdocs
          REL="$HOME/$RELEASE"

          cd "$REL/files"

          # Plesk's Node Toolkit writes this wrapper itself when you save the
          # app in the panel. It is not in git, so a fresh release has none,
          # and without it Passenger cannot find a startup file and serves a
          # 500.
          cat > .bootstrap.cjs <<'BOOTSTRAP'
          // Do not remove or edit this file. Automatically generated by NodeJS Toolkit wrapper to load .mjs files
          import("./server.mjs");
          BOOTSTRAP

          # .env is not in git either. Carry it forward from whatever is
          # currently live so anything set there survives the deploy.
          if [ -L "$APP/files" ] && [ -f "$APP/files/.env" ]; then
            cp -p "$APP/files/.env" .env
          fi

          # First deploy into a fresh subscription has nothing to carry
          # forward. Without SITE_URL the app falls back to localhost and
          # quietly poisons every canonical link and share image.
          if ! grep -qE '^SITE_URL=https?://' .env 2>/dev/null; then
            echo "no usable SITE_URL — writing one from the workflow"
            printf 'SITE_URL=%s\nNODE_ENV=production\nSTATS_FILE=./stats.json\n' \
              "$SITE_URL" > .env
          fi

          export PATH="$HOME/.nodenv/versions/22/bin:$PATH"
          npm ci --omit=dev --no-audit --no-fund

          # A release whose directories are not traversable by the web server
          # produces a 403 while the app itself is healthy — a genuinely
          # confusing failure, so set the modes explicitly.
          find "$REL" -type d -exec chmod 755 {} +
          find "$REL" -type f -exec chmod 644 {} +
          chmod 600 "$REL/files/.env"

          # Atomic swap: build the new link beside the old one, then rename
          # over it. mv -T on a symlink is a single rename(2), so no request
          # ever sees a half-swapped directory.
          ln -sfn "$REL/files" "$APP/files.tmp"
          mv -Tf "$APP/files.tmp" "$APP/files"

          # Passenger's app root is httpdocs, so its restart file lives there
          # rather than inside the release.
          mkdir -p "$APP/tmp"
          touch "$APP/tmp/restart.txt"

          # Prune by name, not mtime: release dirs are YYYYmmdd-HHMMSS-sha,
          # so reverse lexicographic order is reverse chronological, and two
          # releases in the same second still sort correctly.
          cd "$HOME/paljonkose/releases"
          live="$(readlink -f "$APP/files")"
          ls -1d -- */ | sort -r | tail -n +$((KEEP + 1)) | while read -r d; do
            # Never delete whatever is currently serving, whatever the sort says.
            [ "$(readlink -f "${d}files")" = "$live" ] && continue
            rm -rf -- "$d"
          done

          echo "live release: $(readlink "$APP/files")"
          REMOTE

          echo "Deployed ${GITHUB_SHA::7} to $RELEASE"

      - name: Verify the site responds
        run: |
          # A deploy that "succeeded" but serves an error page is not a
          # success. Passenger needs a moment to restart, hence the retries.
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL/healthz" || echo 000)
            [ "$code" = "200" ] && { echo "✓ $HEALTH_URL/healthz returned 200"; exit 0; }
            echo "attempt $i: got $code, retrying…"
            sleep 6
          done
          echo "::error::$HEALTH_URL/healthz did not return 200 after the deploy."
          exit 1
