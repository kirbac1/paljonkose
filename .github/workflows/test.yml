name: Test

# Reusable — called by ci.yml (every push/PR) and deploy.yml (gates the
# production deploy). Keeping it in one place means both always run the
# exact same checks.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  files:
    name: files/ — Vitest + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: files
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: files/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests (Vitest)
        run: npm test

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: files/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  web:
    name: web/ — typecheck + Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test
