# Paste into: Plesk → Domains → YOURDOMAIN → Hosting & DNS →
#             Apache & nginx Settings → "Additional nginx directives"
#
# Do NOT put this in /etc/nginx/sites-available — Plesk regenerates its vhost
# configs and your file will be ignored or clobbered. This field is the
# supported way in; Plesk stores it at
#   /var/www/vhosts/system/YOURDOMAIN/conf/vhost_nginx.conf
# and reloads nginx for you.
#
# Requires "Serve static files directly by nginx" to be ON (same page),
# otherwise requests go through Apache and these location blocks are bypassed.

# ── Clean URLs ────────────────────────────────────────────────────────────
# /2026-08-27-ukraina  →  serves 2026-08-27-ukraina.html
# Each daily entry is its own shareable page, so the URLs should not carry a
# .html suffix that will end up in every share and screenshot.
location / {
    try_files $uri $uri.html $uri/ =404;
}

# ── Hashed assets ─────────────────────────────────────────────────────────
# Safe to cache hard only if your build fingerprints filenames. If it does
# not, drop this block — otherwise a CSS change will not reach anyone who has
# visited before.
location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|avif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# ── HTML ──────────────────────────────────────────────────────────────────
# Must not be cached hard, or today's new entry will not appear for anyone
# who visited yesterday.
location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}

# ── Open data JSON ────────────────────────────────────────────────────────
# Short cache so a corrected figure propagates the same day.
location ~* \.json$ {
    expires 10m;
    add_header Cache-Control "public, must-revalidate";
}

# ── Headers ───────────────────────────────────────────────────────────────
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Note: no X-Frame-Options here on purpose. If you ever want entries to be
# embeddable in an article, SAMEORIGIN blocks it. Add it back if you would
# rather not be framed at all.
