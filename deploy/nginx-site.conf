# /etc/nginx/sites-available/sillasais
#
# server_name is a catch-all on purpose: this answers on the bare IP today
# and keeps working when you point a domain at it. certbot rewrites this
# file when you run it with -d yourdomain.fi, adding the 443 block and the
# redirect — do not hand-edit those in beforehand.

server {
    listen 80 default_server;

    # If `nginx -t` reports "Address family not supported by protocol",
    # this box has no IPv6 — comment the next line out.
    listen [::]:80 default_server;

    server_name _;

    # Symlink, swapped atomically by the post-receive hook.
    root /srv/sillasais/current;
    index index.html;

    # nginx caches the resolved path of `root` per request, but the symlink
    # is re-read each time, so a swap mid-flight is picked up on the next
    # request without a reload.
    disable_symlinks off;

    charset utf-8;

    # ---------------------------------------------------------- routing ---

    # Clean URLs: /2026-08-27-ukraina resolves to that file's .html.
    # Each daily entry being its own shareable page is the whole point of
    # the site, so this matters more here than on a typical static build.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Hashed build assets never change content under the same name.
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML must not be cached hard, or a day's new entry will not show up
    # for anyone who visited yesterday.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Open-data JSON you build from Valtiokonttori / Tilastokeskus.
    # Short cache so a rebuilt figure propagates the same day.
    location ~* \.json$ {
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ------------------------------------------------------ compression ---

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------------------------------------------------------- headers ---

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------ misc ---

    # Dotfiles, but leave .well-known reachable so certbot can validate.
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/sillasais.access.log;
    error_log  /var/log/nginx/sillasais.error.log;
}
